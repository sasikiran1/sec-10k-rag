[project]
name = "sec-10k-rag"
version = "0.1.0"
requires-python = ">=3.12"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sec10k"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: test makes a real network call to an LLM API (deselect with -m 'not live')",
]
filterwarnings = [
    "ignore::bs4.XMLParsedAsHTMLWarning",
]
